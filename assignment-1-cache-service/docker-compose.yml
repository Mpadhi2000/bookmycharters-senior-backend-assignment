version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=bmc_cache
      - DB_USERNAME=root
      - DB_PASSWORD=
    depends_on:
      - mysql
    command: >
      bash -c "
      composer install &&
      echo 'Waiting for MySQL...' &&
      while ! mysqladmin ping -h mysql -P 3306 -uroot --silent; do sleep 1; done &&
      echo 'MySQL is up. Running migrations...' &&
      php yii migrate --interactive=0 &&
      echo 'Starting Yii server...' &&
      php yii serve 0.0.0.0:8080 --docroot=web
      "

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=bmc_cache
      - MYSQL_ROOT_PASSWORD=
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql_data:
